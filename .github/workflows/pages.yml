# Publică aplicația web pe GitHub Pages:
#   /          -> web/          (familia, fețe generice)
#   /magazin/  -> magazin/web/  (versiunea pentru clienți, manechine)
name: Pages
on:
  push:
    branches: [main]
    paths: ["web/**", "magazin/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pregătește site-ul
        run: |
          mkdir -p _site/magazin
          cp -r web/. _site/
          cp -r magazin/web/. _site/magazin/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
